# Web (nginx + static) + API (FastAPI) — single-host deployment.
#
# Local / pre-domain smoke (HTTP only):
#   cp deploy/env.example ../.env   # edit keys as needed
#   docker compose -f deploy/docker-compose.yml up -d --build
#   open http://127.0.0.1:8080
#
# After you have a domain + TLS, swap in deploy/nginx/ssl.conf (see deploy/README.md).

name: travel-agent

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - travel-agent-data:/app/backend/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  travel-agent-data:
