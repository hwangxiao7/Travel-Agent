# HTTP entry (pre-TLS smoke tests). Replace with ssl.conf once you have a domain + cert.
#
# Browser  →  web:80  →  /        static SPA (Vite build)
#                      →  /api/*   proxy → api:8000
#
# WeChat OAuth callback: GET /api/auth/wechat/callback (proxied automatically)

upstream travel_agent_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_pass http://travel_agent_api;
    }

    # Do not expose Prometheus publicly on the web port.
    location = /metrics {
        return 404;
    }
}
