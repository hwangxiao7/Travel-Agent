name: TravelAgent
options:
  bundleIdPrefix: local.travelagent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TravelAgent:
    type: application
    platform: iOS
    sources:
      - path: TravelAgent
    info:
      path: TravelAgent/Info.plist
      properties:
        CFBundleDisplayName: Travel Agent
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Public API for TestFlight / Release. Leave empty until you deploy HTTPS.
        # Override at runtime: Account → Settings → Server / API.
        BetaAPIBaseURL: ""
        # Allow plain-HTTP to the local dev backend (127.0.0.1 / LAN).
        # Prefer HTTPS for BetaAPIBaseURL in TestFlight.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocationWhenInUseUsageDescription: "Used to find activities near you."
        CFBundleURLTypes:
          - CFBundleURLName: local.travelagent.app
            CFBundleURLSchemes:
              - travelagent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.travelagent.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
